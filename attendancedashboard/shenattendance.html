                        <canvas id="myclasstimeChart"></canvas>
                    </div>

                <!--每日在校時間折線圖-->

                        <h1>每日在校時間折線圖</h1>
                        <canvas id="myattentimeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

    </main>
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container">

                </div>
            </div>
            <hr>
            <p class="text-center mb-0">&copy; 2025 產業新尖兵全端班</p>
        </div>
    </footer>

    <!-- 抓取時數 -->
    <script>
        const totalclasshours = document.getElementById("totalclasshours");
        const attendance = document.getElementById("attendance");
        const attendancerate = document.getElementById("attendancerate");
        const unattendance = document.getElementById("unattendance");
        const late = document.getElementById("late");
        const leave_early = document.getElementById("leave_early");
        fetch('shenattendance.json')
            .then(res => res.json())
            .then(data => {
                data.forEach(hours => {
                    console.log(typeof(parseFloat(hours.leave_early_hours)))
                    totalclasshours.innerHTML = `${parseFloat(hours.class_hours).toFixed(2)} 小時`;
                    attendance.innerHTML = `${parseFloat(hours.attended_hours).toFixed(2)} 小時`;
                    const attendanceratenum = parseInt((parseFloat(hours.attended_hours) / parseFloat(hours.class_hours)) * 100);
                    console.log(typeof(attendancerate));
                    attendancerate.innerHTML = `${attendanceratenum}%`;
                    unattendance.innerHTML =`${parseFloat(hours.absent_hours).toFixed(2)} 小時`;
                    late.innerHTML = `${parseFloat(hours.late_hours).toFixed(2)} 小時`;
                    leave_early.innerHTML = `${parseFloat(hours.leave_early_hours).toFixed(2)} 小時`;
                });
            })
    </script>

<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wannabakery</title>
    <link rel="stylesheet" href="CSS_reset.css">
    <!-- 字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&family=LXGW+WenKai+Mono+TC&family=Shadows+Into+Light&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
    <!-- 字型 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
    <link rel="stylesheet" href="wannabakery.css">
</head>

<body>
    <!-- 導覽列 -->
    <nav class="container-fuid nav_top">
        <div class="row col-12">
            <div class="row nav_logoname col-4">
                <div class="col-5">
                    <img src="wannabakerylogo.jpg" class="logo_size">
                </div>
                <div class="col-7 text-start">
                    <div class="bakeryname">Wannabakery</div>
                </div>
            </div>
            <div class="col-8 text-end nav_button">
                <button type="button" class="btn btn_customcolor active" data-bs-toggle="button" autocomplete="off"
                    aria-pressed="true">首頁</button>
                <button type="button" class="btn btn_customcolor" data-bs-toggle="button"
                    autocomplete="off">聯絡我們</button>
                <button type="button" class="btn btn_customcolor" data-bs-toggle="button"
                    autocomplete="off">產品介紹</button>
                <button type="button" class="btn btn_customcolor" data-bs-toggle="button"
                    autocomplete="off">購物車</button>
            </div>
        </div>
    </nav>
    <!-- 輪播器 -->
    <div id="carouselExampleCaptions" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="coffetime.png" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5 class="bannerslogan">『 願你，為自己留一點甜。 』</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="rainnycafe.jpg" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5 class="bannerslogan">『 這不是甜點，是你今天的願望被看見了。 』</h5>
                    <p></p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="sunnycafe.jpg" class="d-block w-100" alt="...">
                <div class="carousel-caption d-none d-md-block">
                    <h5 class="bannerslogan">『 每個願望，都值得被甜甜地實現一次。 』</h5>
                    <p></p>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <div class="container recom_placeholder">
        <div class="card">
            <div class="card-title recom_section_title">
                <h1>推薦商品</h1>
            </div>
            <div class="card-body recom_section_body">
                <div class="row col-12 recom_section_dessert">
                    <div class="card col-3 dess_card">
                        <div class="card-body ratio ratio-1x1"><img src="caramelbuttercookie-1-1.jpg" alt="camarelbuttersandcookie">
                        </div>
                        <div class="card-title">
                            <h3>焦糖奶油夾心餅乾</h3>
                        </div>
                        <div class="card-text">
                            <p>酥脆餅乾加上苦甜椒堂以及香濃奶油夾心。</p>
                        </div>
                    </div>
                    <div class="card col-3 dess_card">
                        <div class="card-body ratio ratio-1x1"><img src="caramelbuttercookie-1-1.jpg" alt="camarelbuttersandcookie">
                        </div>
                        <div class="card-title">
                            <h3>焦糖奶油夾心餅乾</h3>
                        </div>
                        <div class="card-text">
                            <p>酥脆餅乾加上苦甜椒堂以及香濃奶油夾心。</p>
                        </div>
                    </div>
                    <div class="card col-3 dess_card">
                        <div class="card-body ratio ratio-1x1"><img src="caramelbuttercookie-1-1.jpg" alt="camarelbuttersandcookie">
                        </div>
                        <div class="card-title">
                            <h3 class="dess_tit">焦糖奶油夾心餅乾</h3>
                        </div>
                        <div class="card-text">
                            <p class="dess_txt">酥脆餅乾加上苦甜椒堂以及香濃奶油夾心。</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container-fuid">
        <div class="placeholder"></div>
    </div>
    <div class="container-fuid">
        <footer class="footer"></footer>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-p34f1UUtsS3wqzfto5wAAmdvj+osOnFyQFpp4Ua3gs/ZVWx6oOypYoCJhGGScy+8"
        crossorigin="anonymous"></script>
</body>

</html>
